name: Validate Greater Tripoli geodata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/validate_region.py'
      - '.github/workflows/validate-region.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "shapely>=2.0"
      - name: Audit geodata
        run: python scripts/validate_region.py
      - name: Publish audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/greater-tripoli/validation.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish regional geographic integrity audit"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
