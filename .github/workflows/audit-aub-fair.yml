name: Audit Tripoli Fair buildings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check_aub_fair.py'
      - '.github/workflows/audit-aub-fair.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2.0'
      - name: Compare independent building dataset
        run: python scripts/check_aub_fair.py
      - name: Publish aggregate results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/greater-tripoli/aub_fair_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "data: audit Tripoli Fair building geometry source"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
