name: Reconcile Greater Tripoli buildings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile_region.py'
      - '.github/workflows/reconcile-region.yml'
permissions:
  contents: write
concurrency:
  group: geolb-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install "shapely>=2.0"
      - name: Classify OpenStreetMap versus Overture buildings
        run: python scripts/reconcile_region.py
      - name: Commit reconciliation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/greater-tripoli/*_osm_reconciled.geojson data/greater-tripoli/reconciliation.json data/greater-tripoli/building_evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "data: reconcile OSM and Overture Greater Tripoli buildings"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
