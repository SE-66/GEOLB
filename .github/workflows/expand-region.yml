name: Expand Greater Tripoli geodata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_region.py'
      - '.github/workflows/expand-region.yml'
permissions:
  contents: write
concurrency:
  group: geolb-regional-data
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install overturemaps
      - name: Download greater Tripoli tiles
        run: python scripts/refresh_region.py
      - name: Commit data without overwriting concurrent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/greater-tripoli/
          if ! git diff --cached --quiet; then
            git commit -m "data: expand greater Tripoli regional coverage"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
