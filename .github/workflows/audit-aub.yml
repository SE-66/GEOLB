name: Audit additional Tripoli building source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check_aub_buildings.py'
      - '.github/workflows/audit-aub.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'shapely>=2.0'
      - name: Evaluate AUB Tripoli source
        run: python scripts/check_aub_buildings.py
      - name: Publish audit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/greater-tripoli/aub_source_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "data: audit additional Tripoli footprint source"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
