name: Refresh Tripoli open geodata
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install overturemaps
      - name: Download and normalize Tripoli geodata
        run: python scripts/refresh_data.py
      - name: Commit pilot GeoJSON to site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tripoli/*.geojson data/tripoli/manifest.json
          git diff --cached --quiet || (git commit -m "data: refresh Tripoli pilot" && git push)
