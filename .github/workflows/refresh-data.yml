name: Refresh Tripoli open geodata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'studio.html'
      - 'scripts/refresh_data.py'
      - '.github/workflows/refresh-data.yml'
concurrency:
  group: geolb-data-refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install overturemaps
      - name: Download and normalize Tripoli geodata
        run: python scripts/refresh_data.py
      - name: Commit pilot GeoJSON to site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tripoli/*.geojson data/tripoli/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Tripoli pilot"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent push detected; retrying ($attempt/5)"
              sleep 3
            done
            echo "Unable to publish geographic data after retries"
            exit 1
          fi
