name: Enrich GeoLB from open OSM data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/osm_enrichment.py
      - .github/workflows/osm-enrichment.yml
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
      - run: python -u scripts/osm_enrichment.py
      - name: Commit extracted records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/greater-tripoli/osm_enrichment.geojson data/greater-tripoli/osm_enrichment_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish additional open OSM address and entrance points"
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
